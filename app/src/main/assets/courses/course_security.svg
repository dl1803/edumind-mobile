  <line x1="66" y1="134" x2="160" y2="90" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="124" y1="164" x2="170" y2="130" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
